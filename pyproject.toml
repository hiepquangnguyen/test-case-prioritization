[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hcfalcon"
version = "0.1.0"
description = "HC-FALCON: history- and cost-aware submodular test case prioritization"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "external: needs cloned artifacts under external/ (skipped when missing)",
]
